name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.8
          cache: false
      - name: Audit workflow security
        run: mise exec -- zizmor --offline .github/workflows
      - name: Scan history for secrets
        run: mise exec -- gitleaks git --no-banner --redact
      - name: Check dependency vulnerabilities
        run: mise exec -- pnpm audit --audit-level high
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.8
          cache: false
      - run: mise run install
      - run: mise run parity
      - run: mise run agent-policy
      - run: mise run lint
      - run: mise run typecheck
      - run: mise run test
      - run: mise run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.8
          cache: false
      - run: mise run install
      - run: mise exec -- pnpm exec playwright install --with-deps chromium
      - run: mise run e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    if: always()
    needs: [security, checks, browser]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.8
          cache: false
      - name: Require all jobs to succeed
        env:
          GATE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: mise exec -- node scripts/verify-merge-gate.mjs
